---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oshelm.fullname" . }}
  labels:
    {{- include "oshelm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.wavespeed.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 100%, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oshelm.name" . }}
      app.kubernetes.io/instance: {{ include "oshelm.fullname" . }}
      application: {{ include "oshelm.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "oshelm.name" . }}
        app.kubernetes.io/instance: {{ include "oshelm.fullname" . }}
        application: {{ include "oshelm.fullname" . }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $.Values.wavespeed.config.app.port | quote }}
        prometheus.io/path: /metrics
    spec:
      {{- with .Values.wavespeed.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: exporter
          image: "{{ .Values.wavespeed.image.name }}:{{ .Values.wavespeed.image.tag }}"
          imagePullPolicy: {{ .Values.wavespeed.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ $.Values.wavespeed.config.app.port | quote }}
            - name: WS_AI_BASE_URL
              value: {{ .Values.wavespeed.env.WS_AI_BASE_URL | quote }}
            - name: UPDATE_INTERVAL_SECONDS
              value: {{ .Values.wavespeed.env.UPDATE_INTERVAL_SECONDS | quote }}
            - name: REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.wavespeed.env.REQUEST_TIMEOUT_SECONDS | quote }}

            {{- if .Values.wavespeed.wsAiToken.existingSecret }}
            - name: WS_AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.wavespeed.wsAiToken.existingSecret | quote }}
                  key: {{ .Values.wavespeed.wsAiToken.existingSecretKey | quote }}
            {{- else if .Values.wavespeed.wsAiToken.value }}
            - name: WS_AI_TOKEN
              value: {{ .Values.wavespeed.wsAiToken.value | quote }}
            {{- end }}

            - name: POD_IP_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            {{- toYaml .Values.wavespeed.resources | nindent 12 }}
          readinessProbe:
            {{- with .Values.wavespeed.healthcheck_url }}
            httpGet:
              path: {{ $.Values.wavespeed.healthcheck_url }}
              port: {{ $.Values.wavespeed.config.app.port }}
              scheme: HTTP
            {{- else }}
            tcpSocket:
              port: {{ $.Values.wavespeed.config.app.port }}
            {{- end }}
            initialDelaySeconds: 15
            timeoutSeconds: 3
            successThreshold: 1
            periodSeconds: 5
          livenessProbe:
            {{- with .Values.wavespeed.healthcheck_url }}
            httpGet:
              path: {{ $.Values.wavespeed.healthcheck_url }}
              port: {{ $.Values.wavespeed.config.app.port }}
              scheme: HTTP
            {{- else }}
            tcpSocket:
              port: {{ $.Values.wavespeed.config.app.port }}
            {{- end }}
            initialDelaySeconds: 5
            timeoutSeconds: 30
            successThreshold: 1
            failureThreshold: 3
            periodSeconds: 10
